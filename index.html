    <meta property="og:description" content="الرحمن للنقل الجامعي - منصة حجز واشتراكات نقل طلاب الجامعات" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe/preview environment per system guidelines
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (typeof event.reason.message === 'string' &&
            (event.reason.message.includes('WebSocket') ||
             event.reason.message.includes('vite:ws') ||
             event.reason.message.includes('closed without opened'))) ||
          (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && event.message.includes('WebSocket')) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
